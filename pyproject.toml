[project]
name = "tesla-lease-tracker"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "tesla-fleet-api>=1.4.2",
    "aiohttp>=3.13.3",
    "numpy>=2.4.2",
    "statsmodels>=0.14.6",
    "sqlmodel>=0.0.27",
    "psycopg[binary,pool]>=3.2.0",
    "databricks-zerobus-ingest-sdk",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "apx==0.2.6",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "mlflow>=3.6.0",
]

[tool.apx.metadata]
app-name = "tesla-lease-tracker"
app-slug = "tesla_lease_tracker"
app-entrypoint = "tesla_lease_tracker.backend.app:app"
api-prefix = "/api"
metadata-path = "src/tesla_lease_tracker/_metadata.py"

[tool.apx.ui]
root = "src/tesla_lease_tracker/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"


[tool.pytest.ini_options]
addopts = "-m 'not requires_workspace'"
markers = [
    "requires_workspace: test requires a live Databricks workspace connection",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.uv]

[[tool.uv.index]]
name = "apx-index"
url = "https://databricks-solutions.github.io/apx/simple"

[tool.uv.sources]

[tool.uv.sources.apx]
index = "apx-index"

[tool.hatch.build.hooks.version]
path = "src/tesla_lease_tracker/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/tesla_lease_tracker/__dist__", "src/tesla_lease_tracker/_metadata.py"]
exclude = ["src/tesla_lease_tracker/ui"]
