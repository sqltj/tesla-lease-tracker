bundle:
  name: tesla-lease-tracker

sync:
  include:
    - .build

variables:
  region:
    description: "AWS region for deployment"
    default: "us-west-2"
  environment:
    description: "Deployment environment"
    default: "dev"
  alert_email:
    description: "Email for anomaly alerts"
    default: "REPLACE_WITH_YOUR_EMAIL@example.com"
  workspace_host:
    description: "Databricks workspace URL (e.g., https://dbc-abc123.cloud.databricks.com)"
    default: "REPLACE_WITH_YOUR_WORKSPACE_URL"

  # ──────────────────────────────────────────────────────────────
  # Unity Catalog Configuration (Declarative Infrastructure)
  # ──────────────────────────────────────────────────────────────
  primary_catalog:
    description: "Primary Unity Catalog for Tesla Lease Tracker (unified across all environments)"
    default: "main"

  # Medallion Architecture Schemas (Bronze/Silver/Gold)
  bronze_schema:
    description: "Bronze layer: Raw data ingestion zone"
    default: "bronze_tesla_lease_tracker"
  silver_schema:
    description: "Silver layer: Cleaned and validated data"
    default: "silver_tesla_lease_tracker"
  gold_schema:
    description: "Gold layer: Business-ready aggregations and KPIs"
    default: "gold_tesla_lease_tracker"

  # Volume Paths (Free tier compatible)
  ml_artifacts_volume:
    description: "Volume path for ML model artifacts"
    default: "/Volumes/${var.primary_catalog}/${var.bronze_schema}/artifacts"
  metadata_volume:
    description: "Volume path for ingestion metadata"
    default: "/Volumes/${var.primary_catalog}/${var.bronze_schema}/metadata"

artifacts:
  default:
    build: uv run apx build

resources:
  # ──────────────────────────────────────────────────────────────
  # Unity Catalog Resources (Free Tier)
  # ──────────────────────────────────────────────────────────────

  catalogs:
    primary_catalog:
      name: ${var.primary_catalog}
      comment: "Primary data catalog for Tesla Lease Tracker (free tier)"

  schemas:
    bronze_schema:
      catalog_name: ${var.primary_catalog}
      name: ${var.bronze_schema}
      comment: "Bronze layer: Raw data ingestion (Zerobus, APIs)"

    silver_schema:
      catalog_name: ${var.primary_catalog}
      name: ${var.silver_schema}
      comment: "Silver layer: Cleaned and validated data"

    gold_schema:
      catalog_name: ${var.primary_catalog}
      name: ${var.gold_schema}
      comment: "Gold layer: Business-ready aggregations and KPIs"

  volumes:
    bronze_metadata:
      catalog_name: ${var.primary_catalog}
      schema_name: ${var.bronze_schema}
      name: metadata
      volume_type: "MANAGED"
      comment: "Ingestion state and metadata for streaming sources"

    ml_artifacts:
      catalog_name: ${var.primary_catalog}
      schema_name: ${var.bronze_schema}
      name: artifacts
      volume_type: "MANAGED"
      comment: "ML model artifacts and checkpoints"

  experiments:
    forecast_experiment:
      name: "/Users/{{workspace.current_user.email}}/tesla-lease-tracker/forecast"

  # ⚠️ BOOTSTRAP: Uncomment forecast_endpoint block only after first training run
  # completes successfully and registers model version 1 with @champion alias.
  # model_serving_endpoints:
  #   forecast_endpoint:
  #     name: "tesla-lease-tracker-forecast-${bundle.target}"
  #     config:
  #       served_entities:
  #         - entity_name: "main.tesla_lease_tracker.forecast_model@champion"
  #           workload_size: "Small"
  #           scale_to_zero_enabled: true

  pipelines:
    ml_feature_pipeline:
      name: "[${bundle.target}] Tesla Lease Tracker - ML Features"
      catalog: ${var.primary_catalog}
      schema: ${var.silver_schema}
      serverless: true
      libraries:
        - file:
            path: notebooks/ml/ml_feature_pipeline/bronze_mileage.py
        - file:
            path: notebooks/ml/ml_feature_pipeline/silver_forecast_features.py
      configuration:
        lease_start_odometer: "12.0"
        lease_start_date: "2024-06-01"

  sql_warehouses:
    tesla_lease_tracker_warehouse:
      name: "tesla-lease-tracker-warehouse-${bundle.target}"
      cluster_size: "2X-Small"
      enable_serverless_compute: true
      auto_stop_mins: 10
      warehouse_type: "PRO"

  jobs:
    ml_training_pipeline:
      name: "[${bundle.target}] Tesla Lease Tracker - ML Training Pipeline"
      description: "Runs SDP feature pipeline then trains and registers forecast model"
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: run_feature_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ml_feature_pipeline.id}
            full_refresh: false

        - task_key: train_and_register
          depends_on:
            - task_key: run_feature_pipeline
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/ml/train_and_register
          new_cluster:
            spark_version: "16.1.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
          environment_key: ml_env

      environments:
        - environment_key: ml_env
          spec:
            client: "1"
            dependencies:
              - "mlflow>=3.6.0"
              - "numpy>=2.0"
              - "statsmodels>=0.14"
              - "pandas"

    setup_infrastructure:
      name: "Tesla Lease Tracker - Setup Infrastructure"
      description: "One-time setup job for Lakebase and Delta tables (Phase 1)"
      tasks:
        - task_key: create_lakebase
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/1_create_lakebase
          environment_key: python_env
          timeout_seconds: 1800

        - task_key: create_delta_table
          sql_task:
            file:
              path: /Workspace/Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/2_create_delta_table.sql
          warehouse_id: ${resources.sql_warehouses.tesla_lease_tracker_warehouse.id}
          timeout_seconds: 600
          depends_on:
            - task_key: create_lakebase

      environments:
        - environment_key: python_env
          spec:
            client: "1"
            dependencies:
              - "databricks-sdk>=0.20.0"

    backup_mileage_readings:
      name: "[${bundle.target}] Tesla Lease Tracker - Weekly Backup"
      description: "Phase 3: Create point-in-time backup snapshots (weekly)"
      schedule:
        quartz_cron_expression: "0 0 1 ? * SUN"
        timezone_id: "UTC"
      tasks:
        - task_key: create_backup_snapshot
          sql_task:
            file:
              path: /Workspace/Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/4_retention_and_backups.sql
          warehouse_id: ${resources.sql_warehouses.tesla_lease_tracker_warehouse.id}
          timeout_seconds: 900

    anomaly_detection_alerts:
      name: "[${bundle.target}] Tesla Lease Tracker - Data Quality Alerts"
      description: "Phase 3: Monitor for data anomalies and ingestion issues (every 30 min)"
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: check_data_anomalies
          sql_task:
            file:
              path: /Workspace/Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/monitoring/4_anomaly_alerts.sql
          warehouse_id: ${resources.sql_warehouses.tesla_lease_tracker_warehouse.id}
          timeout_seconds: 600

    vacuum_mileage_readings:
      name: "[${bundle.target}] Tesla Lease Tracker - Optimize Storage (Weekly Vacuum)"
      description: "Phase 3: Clean up old files and optimize Delta table storage"
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "UTC"
      tasks:
        - task_key: vacuum_delta_table
          sql_task:
            file:
              path: /Workspace/Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/4_retention_and_backups.sql
          warehouse_id: ${resources.sql_warehouses.tesla_lease_tracker_warehouse.id}
          timeout_seconds: 1200

  apps:
    tesla-lease-tracker-app:
      name: "tesla-lease-tracker"
      description: "tesla-lease-tracker created with apx"
      source_code_path: ./.build
      resources:
        - name: "tesla-lease-tracker-db"
          description: "Lakebase PostgreSQL instance for lease data"

targets:
  dev:
    mode: development
    default: true
    # Note: Set DATABRICKS_HOST environment variable for workspace URL
    # export DATABRICKS_HOST=https://your-workspace.cloud.databricks.com
    variables:
      region: "us-west-2"
      environment: "dev"
      alert_email: "REPLACE_WITH_DEV_EMAIL@example.com"

  staging:
    mode: development
    # Note: Set DATABRICKS_HOST environment variable for workspace URL
    variables:
      region: "us-west-2"
      environment: "staging"
      alert_email: "REPLACE_WITH_STAGING_EMAIL@example.com"

  prod-na:
    mode: production
    # Note: Set DATABRICKS_HOST environment variable for workspace URL
    variables:
      region: "us-west-2"
      environment: "prod-na"
      alert_email: "REPLACE_WITH_PROD_NA_EMAIL@example.com"

  prod-eu:
    mode: production
    # Note: Set DATABRICKS_HOST environment variable for workspace URL
    variables:
      region: "eu-west-1"
      environment: "prod-eu"
      alert_email: "REPLACE_WITH_PROD_EU_EMAIL@example.com"

  prod-cn:
    mode: production
    # Note: Set DATABRICKS_HOST environment variable for workspace URL
    variables:
      region: "cn-north-1"
      environment: "prod-cn"
      alert_email: "REPLACE_WITH_PROD_CN_EMAIL@example.com"
