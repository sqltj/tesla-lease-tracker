bundle:
  name: tesla-lease-tracker

sync:
  include:
    - .build

variables:
  region:
    description: "AWS region for deployment"
    default: "us-west-2"
  environment:
    description: "Deployment environment"
    default: "dev"
  alert_email:
    description: "Email for anomaly alerts"
    default: "admin@example.com"

artifacts:
  default:
    build: uv run apx build

resources:
  jobs:
    setup_infrastructure:
      name: "Tesla Lease Tracker - Setup Infrastructure"
      description: "One-time setup job for Lakebase and Delta tables (Phase 1)"
      tasks:
        - task_key: create_lakebase
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/1_create_lakebase
          job_cluster_key: setup_cluster
          timeout_seconds: 1800

        - task_key: create_delta_table
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/2_create_delta_table
          job_cluster_key: setup_cluster
          timeout_seconds: 600
          depends_on:
            - task_key: create_lakebase

      job_clusters:
        - job_cluster_key: setup_cluster
          new_cluster:
            spark_version: "15.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            aws_attributes:
              availability: "SPOT_WITH_FALLBACK"
            init_scripts: []

    backup_mileage_readings:
      name: "[${bundle.target}] Tesla Lease Tracker - Weekly Backup"
      description: "Phase 3: Create point-in-time backup snapshots (weekly)"
      schedule:
        quartz_cron_expression: "0 0 1 ? * SUN"
        timezone_id: "UTC"
      tasks:
        - task_key: create_backup_snapshot
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/4_retention_and_backups
          job_cluster_key: backup_cluster
          timeout_seconds: 900
      job_clusters:
        - job_cluster_key: backup_cluster
          new_cluster:
            spark_version: "15.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            aws_attributes:
              availability: "SPOT_WITH_FALLBACK"

    anomaly_detection_alerts:
      name: "[${bundle.target}] Tesla Lease Tracker - Data Quality Alerts"
      description: "Phase 3: Monitor for data anomalies and ingestion issues (every 30 min)"
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: check_data_anomalies
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/monitoring/4_anomaly_alerts
          job_cluster_key: alert_cluster
          timeout_seconds: 600
      job_clusters:
        - job_cluster_key: alert_cluster
          new_cluster:
            spark_version: "15.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            aws_attributes:
              availability: "SPOT_WITH_FALLBACK"

    vacuum_mileage_readings:
      name: "[${bundle.target}] Tesla Lease Tracker - Optimize Storage (Weekly Vacuum)"
      description: "Phase 3: Clean up old files and optimize Delta table storage"
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "UTC"
      tasks:
        - task_key: vacuum_delta_table
          notebook_task:
            notebook_path: /Users/{{workspace.current_user.email}}/tesla-lease-tracker/notebooks/setup/4_retention_and_backups
          job_cluster_key: vacuum_cluster
          timeout_seconds: 1200
      job_clusters:
        - job_cluster_key: vacuum_cluster
          new_cluster:
            spark_version: "15.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            aws_attributes:
              availability: "SPOT_WITH_FALLBACK"

  apps:
    tesla-lease-tracker-app:
      name: "tesla-lease-tracker"
      description: "tesla-lease-tracker created with apx"
      source_code_path: ./.build
      resources:
        - name: "tesla-lease-tracker-db"
          description: "Lakebase PostgreSQL instance for lease data"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-xxxx.cloud.databricks.com
    variables:
      region: "us-west-2"
      environment: "dev"
      alert_email: "dev-team@example.com"

  staging:
    mode: development
    workspace:
      host: https://dbc-xxxx.cloud.databricks.com
    variables:
      region: "us-west-2"
      environment: "staging"
      alert_email: "staging-alerts@example.com"

  prod-na:
    mode: production
    workspace:
      host: https://dbc-xxxx.cloud.databricks.com
    variables:
      region: "us-west-2"
      environment: "prod-na"
      alert_email: "prod-alerts@example.com"

  prod-eu:
    mode: production
    workspace:
      host: https://dbc-xxxx.cloud.databricks.com
    variables:
      region: "eu-west-1"
      environment: "prod-eu"
      alert_email: "prod-eu-alerts@example.com"

  prod-cn:
    mode: production
    workspace:
      host: https://dbc-xxxx.cloud.databricks.com
    variables:
      region: "cn-north-1"
      environment: "prod-cn"
      alert_email: "prod-cn-alerts@example.com"
