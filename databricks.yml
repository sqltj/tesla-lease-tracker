bundle:
  name: tesla-lease-tracker

sync:
  include:
    - .build

artifacts:
  default:
    build: uv run apx build

resources:
  apps:
    tesla-lease-tracker-app:
      name: "tesla-lease-tracker"
      description: "tesla-lease-tracker created with apx"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true